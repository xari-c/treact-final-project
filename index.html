<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="row nav__row">
          <div class="nav__logo">
            <figure>
              <img
                class="logo__img"
                src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
                alt="Treact Logo"
              />
            </figure>
            <h2>Treact</h2>
          </div>
          <div class="nav__menu">
            <ul class="nav__links">
              <a href="#features" class="nav__link">About</a>
              <a href="#testimonials" class="nav__link">Blog</a>
              <a href="#pricing" class="nav__link">Pricing</a>
              <a href="" class="nav__link">Contact Us</a>
            </ul>
            <div class="logSign__container">
              <a href="">Login</a>
              <button class="sign__button">Sign Up</button>
            </div>
          </div>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row">
            <div class="hero">
              <div class="hero__card">
                <div class="hero__desc--text">
                  <h1>Beautiful React Templates <span class="purple">for you.</span></h1>
                  <p>Our templates are easy to set up, understand and customize. Fully modular components with a variety of pages and components.</p>
                </div>
                <div class="hero__email--input">
                </div>
                <div class="hero__customers">
                  <h3>Our Trusted Customers</h3>
                  <img src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Logo strip of customers">
                </div>
              </div>
              <img src="./assets/hero-screenshot-1.40a097b525c2f8c9808e.png">
            </div>
          </div>
        </div>
      </header>

    </section>
  </body>
</html>
